services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zaraomni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zaraomni}
      POSTGRES_DB: ${POSTGRES_DB:-zaraomni_db}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zaraomni} -p ${POSTGRES_PORT:-5432} -d ${POSTGRES_DB:-zaraomni_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnicore-network

  # ── One-shot migration & seed runner ────────────────────────────────────────
  # Runs `prisma migrate deploy` then `node prisma/seed.js`, then exits.
  # All services wait for this to complete before starting.
  omnicore-db:
    build:
      context: .
      dockerfile: omnicore-db/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zaraomni}:${POSTGRES_PASSWORD:-zaraomni}@db:5432/${POSTGRES_DB:-zaraomni_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - omnicore-network

  omnicore-auth:
    build:
      context: .
      dockerfile: omnicore-auth/Dockerfile
    ports:
      - ${AUTH_PORT:-3003}:3003
    env_file:
      - ./omnicore-auth/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zaraomni}:${POSTGRES_PASSWORD:-zaraomni}@db:5432/${POSTGRES_DB:-zaraomni_db}
    depends_on:
      db:
        condition: service_healthy
      omnicore-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3003/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - omnicore-network

  omnicore-user:
    build:
      context: .
      dockerfile: omnicore-user/Dockerfile
    ports:
      - ${USER_PORT:-3002}:3002
    env_file:
      - ./omnicore-user/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zaraomni}:${POSTGRES_PASSWORD:-zaraomni}@db:5432/${POSTGRES_DB:-zaraomni_db}
    depends_on:
      db:
        condition: service_healthy
      omnicore-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - omnicore-network

  omnicore-product:
    build:
      context: .
      dockerfile: omnicore-product/Dockerfile
    ports:
      - ${PRODUCT_PORT:-3001}:3001
    env_file:
      - ./omnicore-product/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zaraomni}:${POSTGRES_PASSWORD:-zaraomni}@db:5432/${POSTGRES_DB:-zaraomni_db}
    depends_on:
      db:
        condition: service_healthy
      omnicore-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - omnicore-network

  omnicore-order:
    build:
      context: .
      dockerfile: omnicore-order/Dockerfile
    ports:
      - ${ORDER_PORT:-3004}:3004
    env_file:
      - ./omnicore-order/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zaraomni}:${POSTGRES_PASSWORD:-zaraomni}@db:5432/${POSTGRES_DB:-zaraomni_db}
      - PRODUCT_SERVICE_URL=http://omnicore-product:3001
    depends_on:
      db:
        condition: service_healthy
      omnicore-db:
        condition: service_completed_successfully
      omnicore-product:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3004/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - omnicore-network

  omnicore-payment:
    build:
      context: .
      dockerfile: omnicore-payment/Dockerfile
    ports:
      - ${PAYMENT_PORT:-3005}:3005
    env_file:
      - ./omnicore-payment/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zaraomni}:${POSTGRES_PASSWORD:-zaraomni}@db:5432/${POSTGRES_DB:-zaraomni_db}
      - ORDER_SERVICE_URL=http://omnicore-order:3004
    depends_on:
      db:
        condition: service_healthy
      omnicore-db:
        condition: service_completed_successfully
      omnicore-order:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3005/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - omnicore-network

  omnicore-gateway:
    build:
      context: .
      dockerfile: omnicore-gateway/Dockerfile
    ports:
      - ${GATEWAY_PORT:-3000}:3000
    env_file:
      - ./omnicore-gateway/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zaraomni}:${POSTGRES_PASSWORD:-zaraomni}@db:5432/${POSTGRES_DB:-zaraomni_db}
      - AUTH_SERVICE_URL=http://omnicore-auth:3003
      - PRODUCT_SERVICE_URL=http://omnicore-product:3001
      - USER_SERVICE_URL=http://omnicore-user:3002
      - ORDER_SERVICE_URL=http://omnicore-order:3004
      - PAYMENT_SERVICE_URL=http://omnicore-payment:3005
    depends_on:
      omnicore-db:
        condition: service_completed_successfully
      omnicore-auth:
        condition: service_healthy
      omnicore-user:
        condition: service_healthy
      omnicore-product:
        condition: service_healthy
      omnicore-order:
        condition: service_healthy
      omnicore-payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - omnicore-network

volumes:
  postgres_data:

networks:
  omnicore-network:
    driver: bridge
