services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnicore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnicore}
      POSTGRES_DB: ${POSTGRES_DB:-omnicore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnicore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnicore-network

  omnicore-auth:
    build:
      context: ./omnicore-auth
      dockerfile: Dockerfile
    ports:
      - ${AUTH_PORT:-3003}:3003
    env_file:
      - ./omnicore-auth/.env
    environment:
      # Override DATABASE_URL to use the docker db service instead of localhost
      - DATABASE_URL=postgresql://${POSTGRES_USER:-omnicore}:${POSTGRES_PASSWORD:-omnicore}@db:5432/${POSTGRES_DB:-omnicore}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3003/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - omnicore-network

  omnicore-user:
    build:
      context: ./omnicore-user
      dockerfile: Dockerfile
    ports:
      - ${USER_PORT:-3002}:3002
    env_file:
      - ./omnicore-user/.env
    environment:
      # Override DATABASE_URL to use the docker db service instead of localhost
      - DATABASE_URL=postgresql://${POSTGRES_USER:-omnicore}:${POSTGRES_PASSWORD:-omnicore}@db:5432/${POSTGRES_DB:-omnicore}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - omnicore-network

  omnicore-product:
    build:
      context: ./omnicore-product
      dockerfile: Dockerfile
    ports:
      - ${PRODUCT_PORT:-3001}:3001
    env_file:
      - ./omnicore-product/.env
    environment:
      # Override DATABASE_URL to use the docker db service instead of localhost
      - DATABASE_URL=postgresql://${POSTGRES_USER:-omnicore}:${POSTGRES_PASSWORD:-omnicore}@db:5432/${POSTGRES_DB:-omnicore}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - omnicore-network

  omnicore-gateway:
    build:
      context: ./omnicore-gateway
      dockerfile: Dockerfile
    ports:
      - ${GATEWAY_PORT:-3000}:3000
    env_file:
      - ./omnicore-gateway/.env
    environment:
      # Override DATABASE_URL and service URLs to use docker service names instead of localhost
      - DATABASE_URL=postgresql://${POSTGRES_USER:-omnicore}:${POSTGRES_PASSWORD:-omnicore}@db:5432/${POSTGRES_DB:-omnicore}
      - AUTH_SERVICE_URL=http://omnicore-auth:3003
      - PRODUCT_SERVICE_URL=http://omnicore-product:3001
      - USER_SERVICE_URL=http://omnicore-user:3002
    depends_on:
      omnicore-auth:
        condition: service_healthy
      omnicore-user:
        condition: service_healthy
      omnicore-product:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - omnicore-network

volumes:
  postgres_data:

networks:
  omnicore-network:
    driver: bridge
