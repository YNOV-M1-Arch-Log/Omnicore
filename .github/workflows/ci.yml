name: CI

# Runs on every push/PR to main, and weekly to catch new CVEs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC — picks up Alpine + npm patches

jobs:
  # ── 1. Code Quality & Tests ───────────────────────────────────────────────────
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout root repo + all submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate -w @omnicore/db

      # Services that have lint
      - name: Lint - gateway
        run: npm run lint -w omnicore-gateway

      - name: Lint - product
        run: npm run lint -w omnicore-product

      - name: Lint - order
        run: npm run lint -w omnicore-order

      - name: Lint - payment
        run: npm run lint -w omnicore-payment

      # Services that have unit tests
      - name: Tests - gateway
        run: npm run test:unit -w omnicore-gateway

      - name: Tests - product
        run: npm run test:unit -w omnicore-product

      # Workspace-level security audit (production deps only)
      - name: Security audit
        run: npm audit --audit-level=critical --omit=dev

  # ── 2. Docker Build & CVE Scan ───────────────────────────────────────────────
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: quality
    env:
      HAS_DOCKER_CREDS: ${{ secrets.DOCKER_USERNAME != '' }}

    steps:
      - name: Checkout root repo + all submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build all service images
        run: |
          for service in omnicore-gateway omnicore-auth omnicore-user omnicore-product omnicore-order omnicore-payment omnicore-smtp; do
            echo "▶ Building $service..."
            docker build -f $service/Dockerfile -t $service:ci .
          done

      # Docker Scout scan — requires DOCKER_USERNAME + DOCKER_PASSWORD secrets
      # Set them in: repo Settings → Secrets → Actions
      - name: Login to Docker Hub (for Scout)
        if: ${{ env.HAS_DOCKER_CREDS == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Scan images for HIGH/CRITICAL CVEs
        if: ${{ env.HAS_DOCKER_CREDS == 'true' }}
        run: |
          for service in omnicore-gateway omnicore-auth omnicore-user omnicore-product omnicore-order omnicore-payment omnicore-smtp; do
            echo "▶ Scanning $service..."
            docker scout cves local://$service:ci \
              --exit-code \
              --only-severity critical,high
          done
